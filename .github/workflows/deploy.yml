name: Deploy to Dev and Staging

on:
  push:
    branches: [ main ]

jobs:
  security-scan:
    name: Security scan with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  deploy-dev:
    name: Deploy to Dev
    needs: security-scan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make deploy script executable
        run: chmod +x deploy.sh

      - name: Deploy to Dev environment (fake)
        run: ./deploy.sh dev
        env:
          # Fake secrets – actual values not needed for test
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'dummy' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'dummy' }}
          DEPLOY_API_KEY: ${{ secrets.DEV_DEPLOY_API_KEY || 'dummy' }}

  deploy-staging:
    name: Deploy to Staging
    needs: security-scan
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make deploy script executable
        run: chmod +x deploy.sh

      - name: Deploy to Staging environment (fake)
        run: ./deploy.sh staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'dummy' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'dummy' }}
          DEPLOY_API_KEY: ${{ secrets.STAGING_DEPLOY_API_KEY || 'dummy' }}
